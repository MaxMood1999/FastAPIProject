name: Backend tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: test-password-only
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crm:test-password-only@localhost:5432/crm_test
      TEST_DATABASE_URL: postgresql+psycopg://crm:test-password-only@localhost:5432/crm_test
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests main.py alembic
      - run: ruff format --check app tests main.py alembic
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=88
