name: Backend tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://crm:test-password-only@localhost:5432/crm_test
      TEST_DATABASE_URL: postgresql+psycopg://crm:test-password-only@localhost:5432/crm_test
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Start local PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER crm WITH PASSWORD 'test-password-only';"
          sudo -u postgres createdb -O crm crm_test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests main.py alembic scripts/local_db.py
      - run: ruff format --check app tests main.py alembic scripts/local_db.py
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=88
